    <style>
        :root {
            /* ブラウン系 */
            --color-primary-50: hsl(30, 25%, 97%);
            --color-primary-100: hsl(30, 25%, 92%);
            --color-primary-200: hsl(30, 20%, 85%);
            --color-primary-300: hsl(30, 18%, 70%);
            --color-primary-400: hsl(30, 16%, 55%);
            --color-primary-500: hsl(30, 20%, 43%);
            --color-primary-600: hsl(30, 20%, 35%);
            --color-primary-700: hsl(30, 20%, 27%);
            --color-primary-800: hsl(30, 20%, 20%);
            --color-primary-900: hsl(30, 20%, 12%);

            /* パステルブルー - アクセント */
            --color-secondary-500: hsl(197, 87%, 84%);

            /* オレンジ - アクセント */
            --color-accent: hsl(33, 100%, 71%);
            --color-accent-light: hsl(33, 100%, 85%);

            /* テキストカラー */
            --color-text-primary: hsl(30, 20%, 20%);
            --color-text-secondary: hsl(30, 15%, 40%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans JP', 'Zen Antique Soft', sans-serif;
            background: linear-gradient(135deg, var(--color-primary-50) 0%, var(--color-secondary-500) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 16px;
            padding: 3rem 2rem;
            box-shadow: 0 10px 40px rgba(126, 106, 89, 0.15);
            text-align: center;
        }

        .logo {
            width: 100px;
            height: auto;
            margin: 0 auto 2rem;
            display: block;
        }

        h1 {
            font-family: 'Zen Antique Soft', serif;
            font-size: 1.8rem;
            font-weight: 300;
            color: var(--color-primary-600);
            margin-bottom: 1.5rem;
            letter-spacing: 0.05em;
        }

        p {
            color: var(--color-text-secondary);
            line-height: 2;
            margin-bottom: 2rem;
            font-size: 0.95rem;
            letter-spacing: 0.03em;
        }

        .spinner {
            width: 50px;
            height: 50px;
            margin: 2rem auto;
            border: 4px solid var(--color-primary-100);
            border-top-color: var(--color-accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .redirect-info {
            background: var(--color-primary-50);
            padding: 1.5rem;
            border-radius: 8px;
            margin-top: 2rem;
        }

        .redirect-info p {
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--color-text-primary);
        }

        .redirect-info small {
            color: var(--color-text-secondary);
            font-size: 0.8rem;
        }

        .manual-link {
            display: inline-block;
            margin-top: 2rem;
            padding: 1rem 2.5rem;
            background: transparent;
            color: var(--color-primary-600);
            border: 2px solid var(--color-primary-500);
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
            letter-spacing: 0.05em;
        }

        .manual-link:hover {
            background: var(--color-primary-500);
            color: white;
        }

        /* スマホ対応 - 文字ずれ防止 */
        @media (max-width: 768px) {
            body {
                padding: 1rem;
                word-break: break-word;
                overflow-wrap: anywhere;
            }

            h1, p, span, div {
                letter-spacing: 0.02em !important;
            }

            .container {
                padding: 2.5rem 1.5rem;
            }

            h1 {
                font-size: 1.5rem;
                letter-spacing: 0.02em !important;
                line-height: 1.5;
            }

            p {
                font-size: 0.9rem;
                line-height: 1.8;
            }

            .redirect-info {
                padding: 1.25rem;
            }

            .redirect-info p {
                font-size: 0.85rem;
            }

            .manual-link {
                padding: 0.875rem 2rem;
                font-size: 0.9rem;
                letter-spacing: 0.03em !important;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 2rem 1.25rem;
            }

            h1 {
                font-size: 1.3rem;
            }

            p {
                font-size: 0.85rem;
            }

            .manual-link {
                padding: 0.75rem 1.5rem;
                font-size: 0.85rem;
            }
        }
    </style>

    <script>

        const RESERVATION_URL = 'https://stadiomiia.hacomono.jp/hom';

            setTimeout(function() {
                window.location.href = RESERVATION_URL;
            }, 2000);
        });
