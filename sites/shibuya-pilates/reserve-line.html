    <!-- Design System -->
    <link rel="stylesheet" href="design-system/index.css">

    <style>
        body {
            background: linear-gradient(135deg, #06C755 0%, #04A344 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .redirect-card {
            background: white;
            border-radius: 2rem;
            padding: 3rem;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeInScale 0.5s ease-out;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .line-icon {
            width: 80px;
            height: 80px;
            background: #06C755;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 3rem;
        }

        .redirect-button {
            display: inline-block;
            background: #06C755;
            color: white;
            padding: 1rem 2.5rem;
            border-radius: 3rem;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            margin-top: 1.5rem;
            transition: all 0.3s ease;
        }

        .redirect-button:hover {
            background: #04A344;
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(6, 199, 85, 0.4);
        }

        .redirect-info {
            color: #666;
            font-size: 0.9rem;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #eee;
        }

        .loading-dots {
            display: inline-block;
        }

        .loading-dots span {
            animation: blink 1.4s infinite;
            animation-fill-mode: both;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0; }
            40% { opacity: 1; }
        }

        /* スマホ対応 - 文字ずれ防止 */
        @media (max-width: 768px) {
            body {
                padding: 1rem;
                word-break: break-word;
                overflow-wrap: anywhere;
            }

            h1, p, span, div {
                letter-spacing: 0.02em !important;
            }

            .redirect-card {
                padding: 2rem 1.5rem;
                border-radius: 1.5rem;
            }

            .redirect-card h1 {
                font-size: 1.5rem !important;
                letter-spacing: 0.02em !important;
                line-height: 1.5;
            }

            .redirect-card p {
                font-size: 0.9rem !important;
                line-height: 1.8;
            }

            .line-icon {
                width: 60px;
                height: 60px;
                font-size: 1.5rem !important;
                margin-bottom: 1rem;
            }

            .redirect-button {
                padding: 0.875rem 2rem;
                font-size: 1rem;
            }

            .redirect-info {
                font-size: 0.85rem;
            }

            .redirect-info p {
                font-size: 0.85rem !important;
            }
        }

        @media (max-width: 480px) {
            .redirect-card {
                padding: 1.5rem 1.25rem;
            }

            .redirect-card h1 {
                font-size: 1.3rem !important;
            }

            .redirect-button {
                padding: 0.75rem 1.5rem;
                font-size: 0.9rem;
            }
        }
    </style>
