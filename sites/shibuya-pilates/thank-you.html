<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせありがとうございます | Studio MiiA 六本木</title>

    <!-- Design System -->
    <link rel="stylesheet" href="design-system/index.css">

    <style>
        body {
            background: linear-gradient(135deg, #7e6a59 0%, #9b8476 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            font-family: 'Noto Sans JP', sans-serif;
        }

        .thank-you-card {
            background: white;
            border-radius: 2rem;
            padding: 4rem 3rem;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeInScale 0.5s ease-out;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .check-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #7e6a59, #9b8476);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            font-size: 3rem;
            color: white;
        }

        h1 {
            font-family: 'Zen Antique Soft', serif;
            font-size: 2rem;
            font-weight: 300;
            color: #7e6a59;
            margin-bottom: 1.5rem;
            letter-spacing: 0.05em;
        }

        .message {
            color: #666;
            line-height: 2;
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .urgent-contact {
            background: linear-gradient(135deg, #fff5f0 0%, #ffe8dc 100%);
            border-radius: 1rem;
            padding: 2rem;
            margin: 2rem 0;
            border: 1px solid rgba(126, 106, 89, 0.2);
        }

        .urgent-contact h2 {
            font-family: 'Zen Antique Soft', serif;
            font-size: 1.3rem;
            font-weight: 400;
            color: #7e6a59;
            margin-bottom: 1rem;
            letter-spacing: 0.03em;
        }

        .phone-number {
            font-size: 1.8rem;
            font-weight: bold;
            color: #7e6a59;
            margin: 1rem 0;
            letter-spacing: 0.05em;
        }

        .phone-link {
            display: inline-block;
            background: #7e6a59;
            color: white;
            padding: 1rem 2.5rem;
            border-radius: 3rem;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            margin-top: 1rem;
            transition: all 0.3s ease;
        }

        .phone-link:hover {
            background: #9b8476;
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(126, 106, 89, 0.4);
        }

        .divider {
            height: 1px;
            background: rgba(126, 106, 89, 0.2);
            margin: 2rem 0;
        }

        .cta-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 2rem;
        }

        .btn-secondary {
            display: inline-block;
            padding: 0.875rem 2rem;
            background: transparent;
            border: 1px solid rgba(126, 106, 89, 0.6);
            border-radius: 2px;
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 0.12em;
            text-decoration: none;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .btn-line {
            color: #06C755;
            border-color: rgba(6, 199, 85, 0.6);
        }

        .btn-line:hover {
            background: rgba(6, 199, 85, 0.1);
            border-color: #06C755;
        }

        .btn-hotpepper {
            color: #FF6B35;
            border-color: rgba(255, 107, 53, 0.6);
        }

        .btn-hotpepper:hover {
            background: rgba(255, 107, 53, 0.1);
            border-color: #FF6B35;
        }

        .back-link {
            display: inline-block;
            margin-top: 2rem;
            color: #7e6a59;
            text-decoration: none;
            font-size: 0.9rem;
            transition: opacity 0.3s ease;
        }

        .back-link:hover {
            opacity: 0.7;
        }

        .business-hours {
            font-size: 0.85rem;
            color: #999;
            margin-top: 1rem;
        }
    </style>

    <!-- 広告トラッキングコード用プレースホルダー -->

    <link rel="icon" type="image/png" href="images/logo.webp">
</head>
<body>
    <div class="thank-you-card">
        <div class="check-icon">✓</div>

        <h1>お問い合わせありがとうございます</h1>

        <p class="message">
            体験レッスンのご予約を承りました。<br>
            24時間以内に担当者よりご連絡いたします。
        </p>

        <div class="urgent-contact">
            <h2>お急ぎの方はお電話ください</h2>
            <p style="color: #666; font-size: 0.9rem; line-height: 1.8;">
                すぐにご予約を確定したい場合は、<br>
                お電話でも承っております。
            </p>
            <div class="phone-number">080-3981-9678</div>
            <a href="tel:080-3981-9678" class="phone-link">
                電話で予約する
            </a>
            <p class="business-hours">
                営業時間: 12:00 - 21:00（完全予約制）
            </p>
        </div>

        <div class="divider"></div>

        <p style="color: #666; font-size: 0.95rem; margin-bottom: 1rem;">
            他の予約方法もご利用いただけます
        </p>

        <div class="cta-buttons">
            <a href="reserve-line.html" class="btn-secondary btn-line">
                LINE
            </a>
            <a href="reserve-hotpepper.html" class="btn-secondary btn-hotpepper">
                Hot Pepper
            </a>
        </div>

        <a href="index.html" class="back-link">
            ← トップページに戻る
        </a>
    </div>
</body>
</html>
