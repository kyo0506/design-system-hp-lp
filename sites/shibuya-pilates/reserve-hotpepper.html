<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ホットペッパー予約 | Studio MiiA 六本木</title>

    <!-- Design System -->
    <link rel="stylesheet" href="design-system/index.css">

    <style>
        body {
            background: linear-gradient(135deg, #FF6B35 0%, #F7931E 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .redirect-card {
            background: white;
            border-radius: 2rem;
            padding: 3rem;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeInScale 0.5s ease-out;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .hotpepper-icon {
            width: 80px;
            height: 80px;
            background: #FF6B35;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 3rem;
        }

        .redirect-button {
            display: inline-block;
            background: #FF6B35;
            color: white;
            padding: 1rem 2.5rem;
            border-radius: 3rem;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            margin-top: 1.5rem;
            transition: all 0.3s ease;
        }

        .redirect-button:hover {
            background: #F7931E;
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.4);
        }

        .redirect-info {
            color: #666;
            font-size: 0.9rem;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #eee;
        }

        .loading-dots {
            display: inline-block;
        }

        .loading-dots span {
            animation: blink 1.4s infinite;
            animation-fill-mode: both;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0; }
            40% { opacity: 1; }
        }
    </style>

    <!-- 広告トラッキングコード用プレースホルダー -->
    <!-- ここに Google Analytics、Facebook Pixel、その他のトラッキングコードを追加 -->
    <script>

        // gtag('event', 'conversion', {'send_to': 'AW-CONVERSION_ID/CONVERSION_LABEL'});

        // 例: Facebook Pixel イベント

        console.log('ホットペッパー予約クッションページ - コンバージョン計測ポイント');
    </script>
</head>
<body>
    <div class="redirect-card">
        <div class="hotpepper-icon" style="background: #FF6B35; font-size: 1.5rem; font-weight: bold; color: white;">HOT<br>PEPPER</div>
        <h1 style="font-size: 1.8rem; font-weight: bold; margin-bottom: 1rem; color: #333;">
            ホットペッパーで予約
        </h1>
        <p style="color: #666; line-height: 1.8; margin-bottom: 1.5rem;">
            ホットペッパービューティーの予約ページに移動します。<br>
            24時間いつでもオンライン予約が可能です。
        </p>

        <p style="color: #FF6B35; font-weight: bold; margin-bottom: 0.5rem;">
            自動的にホットペッパーに移動します<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span>
        </p>

        <a href="https://beauty.hotpepper.jp/kr/slnH000594679/" class="redirect-button" id="hotpepperButton">
            今すぐホットペッパーで予約する
        </a>

        <div class="redirect-info">
            <p style="margin-bottom: 0.5rem;">
                <strong>営業時間:</strong> 12:00 - 21:00（完全予約制）
            </p>
            <p style="margin-bottom: 0.5rem;">
                <strong>お電話でも予約可能:</strong> 080-3981-9678
            </p>
            <p style="margin-top: 1rem; font-size: 0.85rem; color: #999;">
                ※ホットペッパービューティーへの会員登録が必要です
            </p>
        </div>
    </div>

    <script>
        // 3秒後に自動リダイレクト
        setTimeout(function() {
            window.location.href = 'https://beauty.hotpepper.jp/kr/slnH000594679/';
        }, 3000);

        // ボタンクリック時のトラッキング
        document.getElementById('hotpepperButton').addEventListener('click', function() {
            // ここに追加のトラッキングコードを記述
            console.log('ホットペッパー予約ボタンクリック');
        });
    </script>
</body>
</html>
